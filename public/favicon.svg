<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
<!-- The FinOpsWay mark: the road, an S-bend that begins as a faded, thinner
     tail and arrives at full thickness under the red pin.

     GENERATED, not drawn here. It is the extension's own icon geometry
     (src/mark.js in the finopsway-extension repo) rendered at 32:

       node -e "console.log(require('./src/mark.js').svg(32, true))"

     with the generated element ids renamed. Do not hand-edit it - move a spine
     point in mark.js and re-run, or the site and the toolbar icon drift, which
     is exactly what happened to the mark this one replaced. The masthead in
     index.html shows THIS FILE with an <img>, so there is one copy of it on the
     site and not two. -->
